<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureDeviceOps</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin: 0;
            font-size: 30px;
        }

        .card p {
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        .NORMAL {
            color: green;
            font-weight: bold;
        }

        .WARNING {
            color: orange;
            font-weight: bold;
        }

        .CRITICAL {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SecureDeviceOps</h1>
        <p class="subtitle">Device Telemetry Operations Dashboard</p>

        <div class="cards">

            <div class="card">
                <h2 id="recordCount">0</h2>
                <p>Telemetry Records</p>
            </div>

            <div class="card">
                <h2 id="deviceCount">0</h2>
                <p>Active Devices</p>
            </div>

            <div class="card">
                <h2 id="warningCount">0</h2>
                <p>Warning Events</p>
            </div>

            <div class="card">
                <h2 id="criticalCount">0</h2>
                <p>Critical Events</p>
            </div>

        </div>

        <p id="statusMessage" style="color:#b00020;"></p>

        <table>

            <thead>
                <tr>
                    <th>Device ID</th>
                    <th>Device Type</th>
                    <th>Firmware</th>
                    <th>Heart Rate</th>
                    <th>Battery</th>
                    <th>Temperature</th>
                    <th>Status</th>
                    <th>Received</th>
                </tr>
            </thead>

            <tbody id="telemetryTable"></tbody>

        </table>

    </div>

    <script type="module">

        function setStatusMessage(message) {
            document.getElementById("statusMessage").textContent = message;
        }

        function updateSummaryCards(records) {
            document.getElementById("recordCount").textContent =
                records.length;

            const devices = new Set(
                records.map(record => record.device_id)
            );
            document.getElementById("deviceCount").textContent =
                devices.size;

            const warningCount = records.filter(
                record => record.status === "WARNING"
            ).length;
            document.getElementById("warningCount").textContent =
                warningCount;

            const criticalCount = records.filter(
                record => record.status === "CRITICAL"
            ).length;
            document.getElementById("criticalCount").textContent =
                criticalCount;
        }

        function buildTelemetryRow(record) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${record.device_id}</td>
                <td>${record.device_type}</td>
                <td>${record.firmware_version}</td>
                <td>${record.heart_rate_bpm} BPM</td>
                <td>${record.battery_percent}%</td>
                <td>${record.temperature_c} °C</td>
                <td class="${record.status}">
                    ${record.status}
                </td>
                <td>${record.received_at}</td>
            `;

            return row;
        }

        function renderTelemetryTable(records) {
            const table = document.getElementById("telemetryTable");
            table.innerHTML = "";

            records.forEach(record => {
                table.appendChild(buildTelemetryRow(record));
            });
        }

        async function fetchTelemetryRecords() {
            const response = await fetch(
                "http://127.0.0.1:8000/api/v1/telemetry"
            );

            if (!response.ok) {
                throw new Error(`API returned status ${response.status}`);
            }

            const data = await response.json();
            return data.records || [];
        }

        async function loadTelemetry() {
            try {
                const records = await fetchTelemetryRecords();

                setStatusMessage("");
                updateSummaryCards(records);
                renderTelemetryTable(records);

            } catch (error) {
                console.error("Unable to retrieve telemetry:", error);

                setStatusMessage(
                    "Unable to reach the SecureDeviceOps API. Is the backend running at http://127.0.0.1:8000?"
                );
            }
        }

        await loadTelemetry();

        setInterval(loadTelemetry, 5000);

    </script>

</body>

</html>
