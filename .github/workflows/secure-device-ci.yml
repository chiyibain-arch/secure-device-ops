name: SecureDeviceOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      # Download repository code onto the GitHub runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Configure the Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install application dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Install SAST scanner
      - name: Install Bandit SAST scanner
        run: pip install bandit

      # Run Static Application Security Testing
      - name: Run Bandit SAST scan
        run: bandit -r app
      # SCA - scan third-party Python dependencies
      - name: Run dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt
      # Secret scanning - detect credentials accidentally committed to Git
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build the application container image
      - name: Build Docker image
        run: docker build -t secure-device-ops:${{ github.sha }} .
      # Scan the built container image for vulnerabilities
      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-device-ops:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      # Generate SBOM for the built container image
      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: secure-device-ops:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
