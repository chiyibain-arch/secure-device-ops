name: SecureDeviceOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      # Download repository code onto the GitHub runner
      # Full history (not the default shallow clone) is required so Gitleaks
      # can resolve commit ranges instead of failing with an unknown revision.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure the Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install application dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Install SAST scanner
      - name: Install Bandit SAST scanner
        run: pip install bandit

      # Run Static Application Security Testing
      - name: Run Bandit SAST scan
        run: bandit -r app
      # SCA - scan third-party Python dependencies
      - name: Run dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt
      # Secret scanning - detect credentials accidentally committed to Git
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build the application container image
      - name: Build Docker image
        run: docker build -t secure-device-ops:${{ github.sha }} .
      # Scan the built container image for vulnerabilities (reporting only —
      # does not fail the build; see severity findings in the job log)
      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-device-ops:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
      # Generate SBOM for the built container image
      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: secure-device-ops:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # Deploy: push the scanned image to Azure Container Registry (main only)
      - name: Azure login (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Tag image for ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag secure-device-ops:${{ github.sha }} ${{ vars.ACR_NAME }}.azurecr.io/secure-device-ops:${{ github.sha }}

      - name: Push image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ vars.ACR_NAME }}.azurecr.io/secure-device-ops:${{ github.sha }}
